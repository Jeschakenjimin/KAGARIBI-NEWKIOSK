<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | Kagaribi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAQZQYmI5pfNSKbuv368nwuRAs1PrtusV4", 
            authDomain: "kagaribi-order.firebaseapp.com", 
            projectId: "kagaribi-order", 
            storageBucket: "kagaribi-order.appspot.com", 
            messagingSenderId: "724955593450", 
            appId: "1:724955593450:web:45fd894a5281906cdef593" 
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
    </script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; margin: 0; height: 100vh;
            background: url("ecbfbd6b-545e-4dec-b2c0-2a53aa08ac11.jpg") no-repeat center center; 
            background-size: cover; display: flex; justify-content: center; align-items: center;
        }
        .login-box { 
            background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 20px; 
            text-align: center; width: 380px; backdrop-filter: blur(15px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
        }
        .login-box h2 { color: white; margin-bottom: 25px; font-weight: 700; letter-spacing: 1px; }
        .login-box input { 
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.9); 
            box-sizing: border-box; font-size: 1rem; outline: none; 
        }
        .btn-login { 
            width: 100%; background: #D30F0F; color: white; padding: 14px; border: none; 
            border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; 
        }
        .btn-login:hover { background: #b00d0d; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ADMIN LOGIN</h2>
        <input type="text" id="admin-email" placeholder="Email Address">
        
        <div style="position: relative; width: 100%;">
            <input type="password" id="admin-password" placeholder="Password" style="padding-right: 45px;">
            <span onclick="toggleVisibility('admin-password', this)" style="position: absolute; right: 12px; top: 12px; cursor: pointer; color: #888;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
        </div>
        
        <button class="btn-login" onclick="checkLogin()">Login</button>
        <p id="login-error" style="color:#ff6b6b; display:none; margin-top:10px; font-size:0.9rem;"></p>
    </div>

    <script>
        // 1. If user is already logged in, send them straight to inventory!
        auth.onAuthStateChanged(user => { 
            if (user) {
                window.location.href = "dailysales.html"; 
            }
        });

        // 2. Login Function
        async function checkLogin() { 
            const email = document.getElementById('admin-email').value; 
            const pass = document.getElementById('admin-password').value; 
            try { 
                await auth.signInWithEmailAndPassword(email, pass); 
                // Note: We don't need a redirect here because the onAuthStateChanged above handles it automatically!
            } catch (err) { 
                // --- ADDED: Custom Error Handling ---
                let customMessage = "An error occurred. Please try again.";
                
                switch (err.code) {
                    case 'auth/invalid-email':
                        customMessage = "Please enter a valid email address.";
                        break;
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential':
                        customMessage = "Incorrect email or password. Please try again.";
                        break;
                    case 'auth/missing-password':
                        customMessage = "Please enter your password.";
                        break;
                    case 'auth/too-many-requests':
                        customMessage = "Too many failed attempts. Please try again later.";
                        break;
                    default:
                        // If it's an error we didn't account for, it will show the default message
                        console.error(err.code, err.message); 
                }

                document.getElementById('login-error').innerText = customMessage; 
                document.getElementById('login-error').style.display = 'block'; 
                // ------------------------------------
            } 
        }

        // 3. Password visibility toggle (SVG style)
        function toggleVisibility(inputId, iconContainer) {
            const input = document.getElementById(inputId);
            const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
            
            if (input.type === "password") {
                input.type = "text";
                iconContainer.innerHTML = eyeClosed; 
            } else {
                input.type = "password";
                iconContainer.innerHTML = eyeOpen; 
            }
        }
    </script>
</body>
</html>
