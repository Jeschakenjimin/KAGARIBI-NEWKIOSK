<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kagaribi | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Include the same CSS as your Sales History file here for consistency */
        :root { --primary: #D30F0F; --sidebar-bg: #1e1e2d; --bg-color: #f3f6f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px; text-align: center; }
        .nav-menu { list-style: none; padding: 20px 0; }
        .nav-menu li { padding: 5px 20px; }
        .nav-menu a { color: #9899ac; text-decoration: none; padding: 12px; display: block; }
        .nav-menu li.active a { background: #2b2b40; color: white; border-left: 4px solid var(--primary); }
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .amount { font-size: 1.5rem; font-weight: 800; color: #181c32; margin-top: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header"><h2>KAGARIBI <span>ADMIN</span></h2></div>
        <ul class="nav-menu">
            <li class="active"><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="sales-history.html">📜 Daily Sales</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <h1>Overview</h1>
        <div class="stats-grid">
            <div class="stat-card"><small>WEEKLY REVENUE</small><div class="amount" id="val-week">₱0.00</div></div>
            <div class="stat-card"><small>MONTHLY REVENUE</small><div class="amount" id="val-month">₱0.00</div></div>
            <div class="stat-card"><small>YEARLY REVENUE</small><div class="amount" id="val-year">₱0.00</div></div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 12px; height: 350px;">
            <canvas id="revenueChart"></canvas>
        </div>
    </main>

    <script>
        const firebaseConfig = { /* PASTE YOUR CONFIG FROM SALES-HISTORY HERE */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadDashboard() {
            const snapshot = await db.collection("archived_sales").get();
            let w=0, m=0, y=0;
            const now = new Date();

            snapshot.forEach(doc => {
                const data = doc.data();
                const d = data.completedAt.toDate();
                const amt = data.total || 0;
                if (now - d < 604800000) w += amt; // Last 7 days
                if (d.getMonth() === now.getMonth()) m += amt;
                if (d.getFullYear() === now.getFullYear()) y += amt;
            });

            document.getElementById('val-week').innerText = "₱" + w.toLocaleString();
            document.getElementById('val-month').innerText = "₱" + m.toLocaleString();
            document.getElementById('val-year').innerText = "₱" + y.toLocaleString();

            new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: { labels: ['Week', 'Month', 'Year'], datasets: [{ label: 'Revenue (₱)', data: [w, m, y], backgroundColor: '#D30F0F' }] },
                options: { maintainAspectRatio: false }
            });
        }
        loadDashboard();
    </script>
</body>
</html>
