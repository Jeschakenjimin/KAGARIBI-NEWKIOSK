    <style>
    :root { --gold: #FFC107; --dark-bg: #121212; --card-bg: #1e1e1e; --deep-red: #ce1126; --success: #27ae60; --text-gray: #b3b3b3; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark-bg); color: white; margin: 0; padding: 20px; }

    /* SALES SUMMARY */
    .sales-summary-bar { display: flex; gap: 20px; margin-bottom: 25px; }
    .summary-card { background: #252525; border-left: 4px solid var(--gold); padding: 15px 25px; border-radius: 8px; flex: 1; }
    .summary-label { display: block; font-size: 0.75rem; color: #888; letter-spacing: 1px; margin-bottom: 5px; }
    .summary-value { font-size: 1.8rem; font-weight: bold; }

    /* HEADER */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }

    /* GRID */
    .billing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .table-card { background: var(--card-bg); border: 1px solid #333; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; position: relative; transition: transform 0.2s; }
    .table-card h2 { margin: 0; color: var(--gold); font-size: 1.6rem; }
    .status-badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
    .item-list { margin: 15px 0; font-size: 0.9rem; max-height: 200px; overflow-y: auto; border-top: 1px solid #333; padding-top: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .cancel-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 1rem; padding: 0 8px; }
    .cancel-btn:hover { color: var(--deep-red); }
    .cancel-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 0.9rem; padding: 0; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; }
    .cancel-btn svg { width:18px; height:18px; }
    .cancel-btn:hover { color: var(--deep-red); background: rgba(255,255,255,0.03); }
    .void-table-btn { background: none; border: 1px solid #333; color: #ccc; padding:6px; border-radius: 6px; cursor: pointer; display:inline-flex; gap:8px; align-items:center; justify-content:center; }
    .void-table-btn svg { width:16px; height:16px; }
    .void-table-btn:hover { background: rgba(255,255,255,0.03); color: var(--deep-red); border-color: rgba(255,255,255,0.06); }
    .void-all-btn { display: none; }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 15px; border-top: 2px solid #333; }
    .total-price { font-size: 1.6rem; font-weight: bold; color: white; }
    .bill-btn { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-size: 1rem; }
    .bill-btn:hover { filter: brightness(1.1); }
    .void-all-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #444; cursor: pointer; }
    #empty-msg { text-align: center; color: #666; margin-top: 50px; grid-column: 1/-1; }

    /* Payment Heading Badges */
    .pay-badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 50px; margin-left: 10px; text-transform: uppercase; font-weight: bold; vertical-align: middle; }
    .b-gcash { background: #007DFE; color: white; }
    .b-maya { background: #000; color: #00ff41; border: 1px solid #00ff41; }
    .b-cash { background: #555; color: white; }

    /* POS Calculator Modal */
    #calc-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; }
    .calc-card { background: #1e1e1e; padding: 25px; border-radius: 15px; width: 320px; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .calc-display { background: #000; padding: 15px; border-radius: 8px; text-align: right; margin-bottom: 15px; }
    .calc-total-label { font-size: 0.8rem; color: #888; }
    .calc-total-val { font-size: 1.5rem; color: var(--gold); font-weight: bold; }
    .calc-input-val { font-size: 2rem; color: #fff; display: block; margin-top: 5px; }
    .calc-change-val { color: var(--success); font-size: 1.2rem; font-weight: bold; }
    .calc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .calc-btn { padding: 20px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; background: #333; color: white; cursor: pointer; }
    .calc-btn:active { background: #444; }
    .calc-btn.action { background: var(--success); grid-column: span 2; }
    .calc-btn.clear { background: var(--deep-red); }

    /* Ensure the receipt is hidden from the main view entirely */
    #print-receipt { display: none !important; position: absolute; left: -9999px; /* Push it off-screen when not printing */ }

    html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
    }

    .notification-banner {
        display: none;
        width: 100%;
        margin-bottom: 15px;
        padding: 14px 18px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
    .notification-banner.success { background: rgba(34, 197, 94, 0.18); color: #d1fae5; border: 1px solid rgba(34, 197, 94, 0.4); }
    .notification-banner.error { background: rgba(239, 68, 68, 0.18); color: #fee2e2; border: 1px solid rgba(239, 68, 68, 0.4); }
    .notification-banner.info { background: rgba(59, 130, 246, 0.18); color: #bfdbfe; border: 1px solid rgba(59, 130, 246, 0.4); }

    /* --- THERMAL PRINTER SPECIFIC CSS --- */

@media print {
    /* 1. Keep the browser page as a receipt-sized page and suppress default browser margins */
    @page {
        size: 80mm auto;
        margin: 0;
    }

    /* 2. Hide everything on the screen by default */
    body * {
        visibility: hidden;
    }

    /* 3. Show ONLY the print receipt and its contents */
    #print-receipt, #print-receipt * {
        visibility: visible;
    }

    /* 4. Position the print area to the top-left with a fixed thermal width and no extra page height */
    #print-receipt {
        display: block !important;
        position: static !important;
        left: auto;
        top: auto;
        width: 72mm;
        max-width: 72mm;
        min-height: 0;
        height: auto;
        margin: 0;
        padding: 0;
        overflow: visible;
        background: white;
        color: black;
    }

    body {
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
    }

    /* 5. Hide scrollbars during print mode */
    ::-webkit-scrollbar {
        display: none;
    }

}

    <script>
        // 1. SALES TRACKER
        function loadDailySales() {
            const startOfToday = new Date();
            startOfToday.setHours(0, 0, 0, 0);

            db.collection("archived_sales")
            .where("completedAt", ">=", startOfToday)
            .orderBy("completedAt", "desc") // Added ordering to see newest first
            .onSnapshot(snapshot => {
                let totalSales = 0;
                let salesHtml = ""; // If you have a list or table for the invoices

                snapshot.forEach(doc => {
                    const data = doc.data();
                    totalSales += data.total || 0;
                    
                    // This is where you connect the invoiceNo to your UI list
                    // Example: If you have a table body with id "sales-list"
                    const inv = data.invoiceNo || "N/A"; 
                    const time = data.completedAt ? data.completedAt.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
                    
                    // You can use this 'inv' variable to populate your Daily Sales table/list
                });

                document.getElementById('daily-total').innerText = `₱${totalSales.toLocaleString()}`;
                document.getElementById('tables-count').innerText = snapshot.size;
            });
        }

        // 2. LIVE MONITORING & GROUPING
        db.collection("orders")
            .where("status", "in", ["Pending", "Served"])
            .onSnapshot(snapshot => {
                const grid = document.getElementById('billing-grid');
                if (snapshot.empty) {
                    grid.innerHTML = '<div id="empty-msg">No active orders.</div>';
                    return;
                }

                let groups = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const table = data.table || "Take Out";
                    
                    if (!groups[table]) {
                        // Capture the method sent from Kitchen/Order
                        groups[table] = { items: [], total: 0, docIds: [], allServed: true, method: data.method || "" };
                    }
                    
                    const itemsWithMeta = data.items.map((item, index) => ({
                        ...item,
                        docId: doc.id,
                        index: index
                    }));

                    groups[table].items.push(...itemsWithMeta);
                    groups[table].total += data.total;
                    groups[table].docIds.push(doc.id);
                    if (data.status === "Pending") groups[table].allServed = false;
                    // Ensure the method persists if found in any related doc
                    if (data.method) groups[table].method = data.method;
                });

                grid.innerHTML = "";
                Object.keys(groups).forEach(tableId => {
                    const data = groups[tableId];
                    const safeData = JSON.stringify(data).replace(/"/g, '&quot;');
                    
                    // NEW: logic to determine which badge to show in heading
                    let badgeHtml = "";
                    if (data.method) {
                        // Convert 'MAYA' to 'CARD' for display purposes
                        const displayMethod = data.method.toUpperCase() === 'MAYA' ? 'CARD' : data.method.toUpperCase();
                        
                        // Assign class based on the normalized name
                        // Note: We use 'b-maya' class for styling, even if the label says 'CARD'
                        const bClass = displayMethod === 'GCASH' ? 'b-gcash' : (displayMethod === 'CARD' ? 'b-maya' : 'b-cash');
                        
                        badgeHtml = `<span class="pay-badge ${bClass}">${displayMethod}</span>`;
                    }

                    const card = document.createElement('div');
                    card.className = "table-card";
                    card.innerHTML = `
    
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="display:flex; align-items:center; gap:8px;">
            ${tableId} ${badgeHtml}
            <button class="void-table-btn" onclick="voidWholeTable('${tableId}', ${JSON.stringify(data.docIds).replace(/"/g, '&quot;')})" title="Void Table">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 3v1H4v2h16V4h-5V3H9zm1 5v10h2V8H10zm4 0v10h2V8h-2zM7 8v10h2V8H7z"/></svg>
            </button>
        </h2>
    </div>

    <div class="item-list" style="flex: 1; overflow-y: auto; min-height: 150px; max-height: 250px; margin-bottom: 10px; padding-right: 5px;">
        ${data.items.map(item => {
        const parts = item.name.split(' (');
        const displayName = parts[0];
        const addonText = parts[1] ? '(' + parts[1] : '';

                    return `
            <div class="item-row" style="align-items: flex-start;">
                <span style="flex: 1; display:flex; gap:8px; align-items:flex-start;">
                    <button class="cancel-btn" aria-label="Void item" onclick="cancelSingleItem('${item.docId}', ${item.index}, '${item.name}')">
                        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 3v1H4v2h16V4h-5V3H9zm1 5v10h2V8H10zm4 0v10h2V8h-2zM7 8v10h2V8H7z"/></svg>
                    </button>
                    <div>
                      <b style="font-size: 1rem;">${item.qty}x ${displayName}</b>
                      <div style="font-size: 0.75rem; color: var(--gold); margin-left: 0;">${addonText}</div>
                    </div>
                </span>
                <span style="font-weight: bold;">₱${(item.qty * item.price).toLocaleString()}</span>
            </div>
        `;
    }).join('')}
    </div>


    <div style="margin-top: auto;">
        
       <div style="margin-bottom: 10px; border-top: 1px solid #333; padding-top: 10px;">
            <span style="font-size: 0.7rem; color: var(--gold); display: block; margin-bottom: 5px; font-weight: bold;">PH SENIOR/PWD & CORKAGE:</span>
            
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                <div style="flex: 1;">
                    <small style="color:#888; font-size: 10px;">TOTAL PAX</small>
                    <input type="number" id="total-pax-${tableId}" value="1" min="1" 
                        style="width: 100%; background:#000; border:1px solid #444; color:white; padding:5px; border-radius:4px;"
                        oninput="calculatePHDiscount('${tableId}', ${data.total}, ${JSON.stringify(data.items).replace(/"/g, '&quot;')})">
                </div>
                <div style="flex: 1;">
                    <small style="color:var(--gold); font-size: 10px;">SENIOR PAX</small>
                    <input type="number" id="senior-pax-${tableId}" value="0" min="0"
                        style="width: 100%; background:#000; border:1px solid var(--gold); color:white; padding:5px; border-radius:4px;"
                        oninput="calculatePHDiscount('${tableId}', ${data.total}, ${JSON.stringify(data.items).replace(/"/g, '&quot;')})">
                </div>
                <div style="flex: 1.5;">
                    <small style="color:var(--gold); font-size: 10px;">SENIOR/PWD ID(s)</small>
                    <input type="text" id="discount-id-${tableId}"
                        style="width: 100%; background:#000; border:1px solid var(--gold); color:white; padding:5px; border-radius:4px;"
                        placeholder="Separate with commas">
                </div>
            </div>

            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                <div style="flex: 1;">
                    <small style="color:#888; font-size: 10px;">OUTSIDE ALCOHOL VALUE (₱)</small>
                    <input type="number" id="corkage-base-${tableId}" value="0" min="0" 
                        style="width: 100%; background:#000; border:1px solid #444; color:white; padding:5px; border-radius:4px;"
                        oninput="calculatePHDiscount('${tableId}', ${data.total}, ${JSON.stringify(data.items).replace(/"/g, '&quot;')})"
                        placeholder="e.g. 800">
                </div>
            </div>
        </div>

        <div class="total-row">

        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="bill-btn" style="flex: 1;" onclick="checkoutPrintOnly('${tableId}', ${safeData})">PRINT RECEIPT</button>
            <button class="bill-btn" style="flex: 1; background: var(--gold); color: #000;" onclick="doneOrder('${tableId}', ${JSON.stringify(data.docIds).replace(/"/g, '&quot;')})">DONE ORDER</button>
        </div>
        
    </div>
`;
                    grid.appendChild(card);
                    // NEW: Force the calculation immediately so it never defaults to 0
                    calculatePHDiscount(tableId, data.total, data.items);
                });
            });

        function calculatePHDiscount(tableId, grossTotal, items) {
    const NON_DISCOUNTABLE = ['SAN MIGUEL APLLE', 'ASAHI', 'SAPPORO', 'SAN MIG', 'PILSNER', 'RED HORSE', 'SAKE', 'SOJU', 'WINE', 'ALCOHOL'];
    
    const totalPax = parseInt(document.getElementById(`total-pax-${tableId}`).value) || 1;
    const seniorPax = parseInt(document.getElementById(`senior-pax-${tableId}`).value) || 0;
    const regularPax = totalPax - seniorPax;
    
    // NEW: Grab Corkage Base and calculate 30% Fee
    const corkageBaseValue = parseFloat(document.getElementById(`corkage-base-${tableId}`).value) || 0;
    const corkageFeeGross = corkageBaseValue * 0.30; 

    let beerGross = 0;
    let foodGross = 0;

    items.forEach(item => {
        const nameUpper = item.name.toUpperCase();
        const isBeer = NON_DISCOUNTABLE.some(keyword => nameUpper.includes(keyword));
        if (isBeer) beerGross += (item.price * item.qty);
        else foodGross += (item.price * item.qty);
    });

    const foodSharePerPerson = foodGross / totalPax;

    // A. Senior Food Portion (VAT-Exempt -> 20% Disc -> +5% SC)
    const seniorFoodExempt = (foodSharePerPerson * seniorPax) / 1.12;
    const seniorDisc = seniorFoodExempt * 0.20;
    const seniorFoodNet = (seniorFoodExempt - seniorDisc) * 1.05;

    // B. Regular Food Portion (Full -> +5% SC)
    const regularFoodPortion = (foodSharePerPerson * regularPax);
    const regularFoodNet = regularFoodPortion * 1.05;

    // C. Beer Portion (Full -> +5% SC)
    const beerNet = beerGross * 1.05;

    // D. NEW: Corkage Fee Portion (Full -> +5% SC)
    const corkageFeeNet = corkageFeeGross * 1.05;

    // Add them all together!
    const finalTotal = seniorFoodNet + regularFoodNet + beerNet + corkageFeeNet;

    // Update UI
    const displayElement = document.getElementById(`total-display-${tableId}`);
    if (displayElement) {
        displayElement.innerText = `₱${finalTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    // Save for Receipt
    const card = displayElement.closest('.table-card');
    card.dataset.seniorFood = seniorFoodNet;
    card.dataset.regularFood = regularFoodNet;
    card.dataset.beerPortion = beerNet;
    card.dataset.corkagePortion = corkageFeeNet; // NEW
    card.dataset.finalTotal = finalTotal;
    card.dataset.discount = seniorDisc;
    card.dataset.vatExempt = seniorFoodExempt;
    
    // Recalculate Service Charge and Vatable Sales to include Corkage
    card.dataset.sc = ( (seniorFoodExempt - seniorDisc) + regularFoodPortion + beerGross + corkageFeeGross ) * 0.05;
    card.dataset.vatable = (regularFoodPortion + beerGross + corkageFeeGross) / 1.12;
    card.dataset.vat = ((regularFoodPortion + beerGross + corkageFeeGross) / 1.12) * 0.12;
}
        // 3. CANCEL INDIVIDUAL ITEM
        function cancelSingleItem(docId, itemIndex, itemName) {
    pendingItemCancel = { docId, index: itemIndex };
    
    const modal = document.getElementById('cancel-item-modal');
    const title = document.getElementById('cancel-item-title');
    const pinInput = document.getElementById('cancel-item-pin');

    // Debugging: If these logs show 'null', the ID in your HTML is wrong
    if (!modal || !title || !pinInput) {
        console.error("Modal elements not found! Check your HTML IDs.");
        return;
    }

    modal.style.display = 'flex';
    title.innerText = `Cancel ${itemName.split(' (')[0]}?`;
    pinInput.value = "";
    pinInput.focus();
}

async function executeCancelItem() {
    // 1. Fix the ID to match your HTML: 'cancel-item-pin'
    const pin = document.getElementById('cancel-item-pin').value;
    
    if (pin !== "1122") {
        alert("Invalid PIN");
        return;
    }

    // 2. Fix the variable name to match: 'pendingItemCancel'
    const { docId, index } = pendingItemCancel;
    const docRef = db.collection("orders").doc(docId);
    const snap = await docRef.get();
    
    if (snap.exists) {
        let items = snap.data().items;
        items.splice(index, 1);

        if (items.length === 0) {
            await docRef.delete();
        } else {

            alert(`Mismatch: You entered ${seniorPax} Senior Pax, but only provided ${discountIdsArray.length} ID(s). Please separate multiple IDs with commas.`);

        // Check if ANY of the entered IDs were already used today

                    savedIds.push(data.discountId);
                }

                // Compare our current array with the saved array
                discountIdsArray.forEach(id => {
                    if (savedIds.includes(id)) {

                });

    activeCheckoutData = {

        const seniorPax = seniorPaxInput ? parseInt(seniorPaxInput.value) : 0;
        const discountIdInput = document.getElementById(`discount-id-${tableId}`);
        const rawIds = discountIdInput ? discountIdInput.value.trim() : "";
        const discountIdsArray = rawIds.split(',').map(id => id.trim()).filter(id => id.length > 0);

        // 4. Get the group data to extract method and items
        const groupDataAttr = card ? card.innerHTML : '';
        const methodMatch = groupDataAttr.match(/Mode: (\w+)/);
        const method = methodMatch ? methodMatch[1] : 'CASH';

        // Get items from the group - we need to extract from the order docs
        let allItems = [];
        for (const docId of docIds) {
            const docSnap = await db.collection("orders").doc(docId).get();
            if (docSnap.exists) {
                allItems = allItems.concat(docSnap.data().items || []);
            }
        }

        // 5. Generate invoice number and order ID
        const invoiceNo = Math.floor(1000 + Math.random() * 9000);
        const orderId = Math.floor(Math.random() * 99999).toString().padStart(5, '0').toUpperCase();

        // 6. Save to archived_sales (daily sales)
        await db.collection("archived_sales").add({
            invoiceNo: invoiceNo,
            table: tableId,
            total: finalTotal,
            cashPaid: finalTotal,
            change: 0,
            method: method,
            serviceFee: sc,
            vat: vat,
            discount: discount,
            vatable: vatable,
            vatExempt: vatExempt,
            
            seniorFood: seniorPortion,
            regularFood: regularPortion,
            alcoholSales: beerPortion,
            corkageFee: corkagePortion,
            seniorPax: seniorPax,
            discountIds: discountIdsArray || [],
            
            items: allItems,
            completedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // 7. Delete order from orders collection (completely remove, don't keep status)
        const batch = db.batch();
        docIds.forEach(id => {
            batch.delete(db.collection("orders").doc(id));
        });
        await batch.commit();

        showBillingNotification(`Order marked as done. Added to daily sales and removed from dashboard.`, 'success');
    } catch (err) {
        console.error('Error marking order as done:', err);
        showBillingNotification('Failed to mark order as done. See console for details.', 'error');
    }
}

// Helper to handle the "Vanish" (Firebase tasks) - UPDATED TO SAVE ARRAY OF IDs
async function finishDatabaseTasks(tableId, group, paid, change, method, finalTotalToSave, serviceCharge, vatAmount, discountAmount, vatableSales, vatExemptSales, newSaleRef, invoiceNo, seniorPort, regularPort, beerPort, corkagePort, discountIdsArray) {
    
    try {
        console.log('[Billing] Saving archived_sale', { invoiceNo, table: tableId, total: finalTotalToSave, discount: discountAmount, discountIds: discountIdsArray });
        await newSaleRef.set({
            invoiceNo: invoiceNo,
            table: tableId, 
            total: finalTotalToSave, 
            cashPaid: paid, 
            change: change, 
            method: method,
            serviceFee: serviceCharge, 
            vat: vatAmount,            
            discount: discountAmount,  
            vatable: vatableSales,     
            vatExempt: vatExemptSales, 
            
            seniorFood: seniorPort,
            regularFood: regularPort,
            alcoholSales: beerPort,
            corkageFee: corkagePort,
            discountIds: discountIdsArray || [], // NEW: Saves all IDs as an array
            
            items: group.items, 
            completedAt: firebase.firestore.FieldValue.serverTimestamp()    
        });
        console.log('[Billing] archived_sale saved:', newSaleRef.id);
    } catch (err) {
        console.error('[Billing] archived_sale set failed:', err);
        showBillingNotification('Failed to save archived sale. See console for details.', 'error');
    }
    
    const batch = db.batch();
    group.docIds.forEach(id => batch.update(db.collection("orders").doc(id), { 
        status: "Completed",
        total: finalTotalToSave,
        discount: discountAmount,
        discountIds: discountIdsArray || []
    }));
    try {
        await batch.commit();
        console.log('[Billing] Orders updated (batch.commit) for docIds:', group.docIds);
        showBillingNotification(`Checkout complete. Orders updated for ${group.docIds.length} item(s).`, 'success');
    } catch (err) {
        console.error('[Billing] batch.commit failed:', err);
        showBillingNotification('Failed to update order status. See console for details.', 'error');
    }
    
    setTimeout(() => {
        const receipt = document.getElementById('print-receipt');
        if (receipt) {
            receipt.style.display = 'none';
            receipt.innerHTML = "";
        }
    }, 10000);
}


let pendingVoid = { tableId: "", docIds: [] };

function voidWholeTable(tableId, docIds) {
    pendingVoid = { tableId, docIds };
    document.getElementById('void-modal').style.display = 'flex';
    document.getElementById('void-title').innerText = `Void ${tableId}?`;
    document.getElementById('void-pin').value = "";
    document.getElementById('void-pin').focus();
}

async function executeVoid() {
    const pin = document.getElementById('void-pin').value;
    if (pin !== "1122") {
        alert("Invalid PIN");
        return;
    }

    const { docIds } = pendingVoid;
    const batch = db.batch();
    
    docIds.forEach(id => {
        batch.delete(db.collection("orders").doc(id));
    });
    
    await batch.commit();
    document.getElementById('void-modal').style.display = 'none';
}

function showBillingNotification(message, type = 'info') {
    const banner = document.getElementById('billing-notification');
    if (!banner) return;
    banner.innerText = message;
    banner.className = `notification-banner ${type}`;
    banner.style.display = 'block';
    clearTimeout(window.billingNotificationTimeout);
    window.billingNotificationTimeout = setTimeout(() => {
        banner.style.display = 'none';
    }, 6000);
}

function log(message) {
    console.log(message);
}

function toggleVisibility(inputId) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }
}
